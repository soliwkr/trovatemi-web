name: Gate 2 Production Smoke

on:
  push:
    branches:
      - test/gate2-production-smoke
    paths:
      - .github/workflows/gate2-production-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create and reread production event
        id: smoke
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H 'content-type: application/json'             -d '{"title":"__gate2_smoke__","date":"2026-09-30","time":"20:00","venue":"Trovatemi Smoke","city":"Formia","sourceDigest":"gate2-smoke"}'             https://trovatemi.it/api/events > "$RUNNER_TEMP/create.json"

          EVENT_ID="$(node -e 'const x=require(process.env.RUNNER_TEMP+"/create.json"); if(!x.event?.id) process.exit(1); process.stdout.write(x.event.id)')"
          echo "event_id=$EVENT_ID" >> "$GITHUB_OUTPUT"

          curl --fail --silent --show-error             https://trovatemi.it/api/events/$EVENT_ID > "$RUNNER_TEMP/read.json"

          node <<'NODE'
          const fs=require('node:fs');
          const created=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/create.json','utf8')).event;
          const read=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/read.json','utf8')).event;
          if (!created?.id || !read?.id) throw new Error('missing persisted event');
          for (const k of ['id','title','event_date','event_time','venue','city','lifecycle_status']) {
            if (created[k] !== read[k]) throw new Error('mismatch on '+k);
          }
          if (read.lifecycle_status !== 'draft') throw new Error('wrong lifecycle');
          console.log('Gate 2 persistence verified:', read.id);
          NODE

      - name: Cleanup smoke event
        if: always() && steps.smoke.outputs.event_id != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT_ID: ${{ steps.smoke.outputs.event_id }}
        run: |
          npx wrangler d1 execute trovatemi-events --remote             --command "DELETE FROM events WHERE id='$EVENT_ID';" --yes
