name: Registry Discovery Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/radar-worker/**"
      - ".github/workflows/registry-discovery-deploy.yml"

permissions:
  contents: read

concurrency:
  group: registry-discovery-production
  cancel-in-progress: false

jobs:
  deploy-and-seed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/radar-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_URL: https://trovatemi-radar-preview.soliwkr.workers.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify deploy credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy Radar Worker
        run: npx wrangler deploy

      - name: Trigger bounded registry discovery
        run: |
          curl --fail --silent --show-error             -X POST             "$PREVIEW_URL/api/registry/discovery/run"             > "$RUNNER_TEMP/registry-run.json"
          cat "$RUNNER_TEMP/registry-run.json"

      - name: Verify discovery status
        run: |
          curl --fail --silent --show-error             "$PREVIEW_URL/api/registry/discovery/status"             > "$RUNNER_TEMP/registry-status.json"
          cat "$RUNNER_TEMP/registry-status.json"
          node <<'NODE'
          const fs = require('node:fs');
          const x = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/registry-status.json', 'utf8'));
          if (x.scope !== 'formia-v0') throw new Error('wrong scope');
          if (x.targetTotal !== 50) throw new Error('target must remain 50');
          if (x.currentTotal < 1 || x.currentTotal > 50) throw new Error('candidate count outside bounded range');
          if (x.paidOverageAllowed !== false) throw new Error('paid overage must remain disabled');
          NODE
