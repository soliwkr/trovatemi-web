name: Radar Worker Preview

on:
  pull_request:
    paths:
      - "apps/radar-worker/**"
      - ".github/workflows/radar-worker-preview.yml"

permissions:
  contents: read

concurrency:
  group: radar-worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/radar-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Cloudflare typegen + typecheck
        run: npm run check

      - name: Install browser smoke dependency
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium

      - name: Unit tests
        run: npm test

      - name: Build official Vite + Hono starter
        run: npm run build

      - name: Dry-run Worker
        run: npx wrangler deploy --dry-run

      - name: Verify deploy secrets
        if: github.head_ref == 'feat/radar-cloudflare-hono'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$GOOGLE_PLACES_API_KEY" || { echo "Missing GOOGLE_PLACES_API_KEY"; exit 1; }

      - name: Deploy isolated Radar Worker
        if: github.head_ref == 'feat/radar-cloudflare-hono'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Sync Places secret
        if: github.head_ref == 'feat/radar-cloudflare-hono'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: printf '%s' "$GOOGLE_PLACES_API_KEY" | npx wrangler secret put GOOGLE_PLACES_API_KEY

      - name: Smoke public preview
        if: github.head_ref == 'feat/radar-cloudflare-hono'
        env:
          PREVIEW_URL: https://trovatemi-radar-preview.soliwkr.workers.dev
        run: |
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 \
            "$PREVIEW_URL/health" > "$RUNNER_TEMP/health.json"
          grep -Fq '"service":"trovatemi-radar"' "$RUNNER_TEMP/health.json"

          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 3 \
            -H 'content-type: application/json' \
            -d '{"category":"officina","city":"Formia","limit":6}' \
            "$PREVIEW_URL/api/runs" > "$RUNNER_TEMP/run.json"
          grep -Fq '"source":"google_places"' "$RUNNER_TEMP/run.json"
          grep -Fq '"prospects":[' "$RUNNER_TEMP/run.json"

          node <<'NODE' > "$RUNNER_TEMP/share-target.env"
          const fs = require('node:fs');
          const run = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/run.json', 'utf8'));
          const prospect = run.prospects.find((item) => item.eligible);
          if (!prospect) throw new Error('No eligible prospect returned by smoke scan');
          console.log('RUN_ID=' + run.id);
          console.log('PROSPECT_ID=' + prospect.id);
          NODE
          source "$RUNNER_TEMP/share-target.env"

          curl --fail --silent --show-error \
            -X POST \
            "$PREVIEW_URL/api/runs/$RUN_ID/prospects/$PROSPECT_ID/share" \
            > "$RUNNER_TEMP/share.json"

          node <<'NODE' > "$RUNNER_TEMP/check-target.env"
          const fs = require('node:fs');
          const share = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/share.json', 'utf8'));
          if (!share.shareUrl || !share.outreachMessage) throw new Error('Share pack incomplete');
          const token = share.shareUrl.split('/').filter(Boolean).at(-1);
          if (!/^[a-f0-9]{32}$/.test(token)) throw new Error('Invalid share token');
          console.log('CHECK_TOKEN=' + token);
          console.log('SHARE_URL=' + share.shareUrl);
          NODE
          source "$RUNNER_TEMP/check-target.env"

          curl --fail --silent --show-error \
            "$PREVIEW_URL/api/checks/$CHECK_TOKEN" > "$RUNNER_TEMP/check.json"

          node <<'NODE'
          const fs = require('node:fs');
          const check = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/check.json', 'utf8'));
          const raw = JSON.stringify(check);
          if ('score' in check || raw.includes('"score"')) throw new Error('Internal score leaked into public check');
          if (raw.includes('@')) throw new Error('Email-like value leaked into public check');
          if (!check.journey?.length) throw new Error('Public check has no customer journey');
          if (!check.actions?.length) throw new Error('Public check has no actions');
          const copy = JSON.stringify({journey: check.journey, actions: check.actions}).toLowerCase();
          if (copy.includes('gap recensioni') || copy.includes('conversion friction') || copy.includes('opportunity score')) {
            throw new Error('Internal jargon leaked into customer check');
          }
          NODE

          curl --fail --silent --show-error \
            "$PREVIEW_URL/c/$CHECK_TOKEN" > "$RUNNER_TEMP/check-page.html"
          grep -Fq '<div id="root"></div>' "$RUNNER_TEMP/check-page.html"

          curl --fail --silent --show-error \
            "$PREVIEW_URL/a/$CHECK_TOKEN" > "$RUNNER_TEMP/activation-page.html"
          grep -Fq '<div id="root"></div>' "$RUNNER_TEMP/activation-page.html"

          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', (error) => errors.push(String(error)));

            await page.goto(process.env.SHARE_URL, { waitUntil: 'networkidle' });
            await page.getByText('SEI MEGLIO DI COME APPARI.').waitFor({ timeout: 15000 });
            await page.getByText('Sistemamelo').waitFor({ timeout: 15000 });

            await page.goto(process.env.PREVIEW_URL + '/a/' + process.env.CHECK_TOKEN, { waitUntil: 'networkidle' });
            await page.getByText('ACCENDI').waitFor({ timeout: 15000 });
            await page.getByText('€197').first().waitFor({ timeout: 15000 });

            if (errors.length) throw new Error('Browser page errors: ' + errors.join(' | '));
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          curl --fail --silent --show-error -X POST \
            "$PREVIEW_URL/api/checks/$CHECK_TOKEN/events/view" > "$RUNNER_TEMP/view-stats.json"
          cat "$RUNNER_TEMP/view-stats.json"
          node -e 'const x=require(process.env.RUNNER_TEMP+"/view-stats.json"); if(x.views < 1) process.exit(1)'

          curl --silent --show-error --output /dev/null --dump-header "$RUNNER_TEMP/cta.headers" \
            "$PREVIEW_URL/go/$CHECK_TOKEN"
          cat "$RUNNER_TEMP/cta.headers"
          grep -Fiq '/a/' "$RUNNER_TEMP/cta.headers"

          curl --fail --silent --show-error -X POST \
            -H 'content-type: application/json' \
            -d '{"ownerName":"Mario Test","email":"mario.test@example.com"}' \
            "$PREVIEW_URL/api/checks/$CHECK_TOKEN/activation-intent" > "$RUNNER_TEMP/activation.json"
          cat "$RUNNER_TEMP/activation.json"
          node -e 'const x=require(process.env.RUNNER_TEMP+"/activation.json"); if(!x.ok || (x.checkoutReady===false && x.status!=="intent_recorded")) process.exit(1)'

          curl --fail --silent --show-error \
            "$PREVIEW_URL/api/checks/$CHECK_TOKEN/stats" > "$RUNNER_TEMP/final-stats.json"
          cat "$RUNNER_TEMP/final-stats.json"
          node -e 'const x=require(process.env.RUNNER_TEMP+"/final-stats.json"); if(x.views < 1 || x.ctaClicks < 1 || x.activationIntents < 1) process.exit(1)'

          echo "Radar preview — $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Real automotive check — $SHARE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Share flow — scan → narrative check → open → CTA → activation intent: OK" >> "$GITHUB_STEP_SUMMARY"
