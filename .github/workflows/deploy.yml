name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://trovatemi.it/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api --method POST
          "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          -f state=pending
          -f context=cloudflare/deployment
          -f description="Cloudflare deployment in progress"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run check

      - name: Build Astro Worker
        run: npm run build

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$GOOGLE_PLACES_API_KEY" || { echo "Missing GOOGLE_PLACES_API_KEY"; exit 1; }

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.112.0"
          command: deploy

      - name: Publish deployment summary
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOYMENT_URL: https://trovatemi.it/
        run: echo "Production URL — $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Radar dependencies
        if: steps.deploy.outcome == 'success'
        working-directory: apps/radar-worker
        run: npm install --no-audit --no-fund

      - name: Validate Radar Worker
        if: steps.deploy.outcome == 'success'
        working-directory: apps/radar-worker
        run: npm run check && npm test && npm run build

      - name: Deploy Radar + Check custom domains
        if: steps.deploy.outcome == 'success'
        working-directory: apps/radar-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Sync Radar Places secret
        if: steps.deploy.outcome == 'success'
        working-directory: apps/radar-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: printf '%s' "$GOOGLE_PLACES_API_KEY" | npx wrangler secret put GOOGLE_PLACES_API_KEY

      - name: Verify Radar and Check domains
        id: verify_radar
        if: steps.deploy.outcome == 'success'
        run: |
          curl --fail --silent --show-error -H 'accept: application/dns-json' \
            'https://cloudflare-dns.com/dns-query?name=radar.trovatemi.it&type=A' > "$RUNNER_TEMP/doh-radar.json"
          curl --fail --silent --show-error -H 'accept: application/dns-json' \
            'https://cloudflare-dns.com/dns-query?name=check.trovatemi.it&type=A' > "$RUNNER_TEMP/doh-check.json"

          RADAR_IP="$(node -e 'const x=require(process.env.RUNNER_TEMP+"/doh-radar.json"); const a=x.Answer?.find(v=>v.type===1)?.data; if(!a) process.exit(1); process.stdout.write(a)')"
          CHECK_IP="$(node -e 'const x=require(process.env.RUNNER_TEMP+"/doh-check.json"); const a=x.Answer?.find(v=>v.type===1)?.data; if(!a) process.exit(1); process.stdout.write(a)')"

          curl --resolve "radar.trovatemi.it:443:$RADAR_IP" --fail --silent --show-error \
            https://radar.trovatemi.it/health > "$RUNNER_TEMP/radar-health.json"
          grep -Fq '"service":"trovatemi-radar"' "$RUNNER_TEMP/radar-health.json"

          curl --resolve "radar.trovatemi.it:443:$RADAR_IP" --fail --silent --show-error \
            --dump-header "$RUNNER_TEMP/radar-home.headers" \
            https://radar.trovatemi.it/ > "$RUNNER_TEMP/radar-home.html"
          grep -Fq '<div id="root"></div>' "$RUNNER_TEMP/radar-home.html"
          grep -Fiq "script-src 'self' 'unsafe-inline'" "$RUNNER_TEMP/radar-home.headers"
          grep -Fiq "style-src 'self' 'unsafe-inline'" "$RUNNER_TEMP/radar-home.headers"

          curl --resolve "check.trovatemi.it:443:$CHECK_IP" --silent --show-error \
            --output /dev/null --dump-header "$RUNNER_TEMP/check-root.headers" \
            https://check.trovatemi.it/
          grep -Fiq 'location: https://trovatemi.it' "$RUNNER_TEMP/check-root.headers"

      - name: Verify production homepage
        id: verify
        if: steps.deploy.outcome == 'success'
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 --max-time 20 \
            https://trovatemi.it/ > "$RUNNER_TEMP/trovatemi-home.html"
          grep -Fq "TROVERESTI?" "$RUNNER_TEMP/trovatemi-home.html"
          grep -Fq 'id="search-form"' "$RUNNER_TEMP/trovatemi-home.html"
          grep -Fq "Cercati come ti cerca un cliente." "$RUNNER_TEMP/trovatemi-home.html"

          curl --fail --silent --show-error \
            -H 'content-type: application/json' \
            -d '{"category":"officina","city":"Formia"}' \
            https://trovatemi.it/api/public-search > "$RUNNER_TEMP/public-search.json"

          node <<'NODE' > "$RUNNER_TEMP/public-target.env"
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/public-search.json', 'utf8'));
          if (!data.runId || !Array.isArray(data.results) || !data.results.length) throw new Error('Public search incomplete');
          const item = data.results[0];
          if ('score' in item || 'band' in item) throw new Error('Internal scoring leaked into public search');
          console.log('PUBLIC_RUN_ID=' + data.runId);
          console.log('PUBLIC_PROSPECT_ID=' + item.id);
          NODE
          source "$RUNNER_TEMP/public-target.env"

          curl --fail --silent --show-error \
            -H 'content-type: application/json' \
            -d "{\"runId\":\"$PUBLIC_RUN_ID\",\"prospectId\":\"$PUBLIC_PROSPECT_ID\"}" \
            https://trovatemi.it/api/public-check > "$RUNNER_TEMP/public-check.json"

          node -e 'const x=require(process.env.RUNNER_TEMP+"/public-check.json"); if(!x.shareUrl?.startsWith("https://check.trovatemi.it/c/")) process.exit(1)'

      - name: Publish deployment status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_URL: https://trovatemi.it/
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          RADAR_VERIFY_OUTCOME: ${{ steps.verify_radar.outcome }}
        run: |
          if [ "$DEPLOY_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ] && [ "$RADAR_VERIFY_OUTCOME" = "success" ]; then
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=success \
              -f context=cloudflare/deployment \
              -f description="Cloudflare Worker deployed" \
              -f target_url="$DEPLOYMENT_URL"
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=failure \
              -f context=cloudflare/deployment \
              -f description="Cloudflare deployment failed"
          fi
