name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build Worker
        run: npm run build

      - name: Validate Cloudflare bundle
        run: npx wrangler deploy --dry-run

      - name: Guard mobile homepage and Radar CSP regressions
        run: |
          grep -Fq 'overflow-x:hidden' src/pages/index.astro
          if grep -Eq '2[0-9]vw' src/pages/index.astro; then
            echo 'Mobile hero regression: oversized vw title can overflow the viewport'
            exit 1
          fi
          grep -Fq "style-src 'self' 'unsafe-inline'" apps/radar-worker/src/worker/index.ts
          grep -Fq "script-src 'self' 'unsafe-inline'" apps/radar-worker/src/worker/index.ts
