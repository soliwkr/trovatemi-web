name: Preview Beauty Check v2 on Cloudflare Workers

on:
  push:
    branches: [feat/beauty-check-passaparola-v2]
    paths:
      - ".github/workflows/preview-beauty-check-v2.yml"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "src/env.d.ts"
      - "src/pages/beauty-check/**"
      - "src/pages/api/places/**"
      - "src/data/beauty-check-v2.mjs"
      - "src/data/beauty-lean-demo.mjs"
      - "src/data/google-places.mjs"
      - "src/layouts/BeautyLeanLayout.astro"
      - "src/styles/beauty-lean.css"
      - "src/styles/beauty-check-v2.css"
      - "tests/beauty-check-v2.test.mjs"
      - "tests/google-places.test.mjs"
      - "wrangler.beauty-check-v2-preview.jsonc"

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: preview-beauty-check-passaparola-v2
  cancel-in-progress: true

jobs:
  preview:
    name: Validate and publish isolated Beauty Check v2 preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build Astro Worker
        run: npm run build

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Publish isolated preview Worker
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.112.0"
          command: deploy --config wrangler.beauty-check-v2-preview.jsonc

      - name: Verify preview route
        env:
          PREVIEW_BASE_URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          test -n "$PREVIEW_BASE_URL" || { echo "Missing preview deployment URL"; exit 1; }
          PREVIEW_URL="${PREVIEW_BASE_URL%/}/beauty-check/"
          curl --fail --location --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 --max-time 20 \
            "$PREVIEW_URL" > "$RUNNER_TEMP/trovatemi-beauty-check-v2.html"
          grep -Fq "Beauty Check" "$RUNNER_TEMP/trovatemi-beauty-check-v2.html"
          grep -Fq "data-funnel-app" "$RUNNER_TEMP/trovatemi-beauty-check-v2.html"
          echo "Beauty Check v2 preview — $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish preview URL on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_BASE_URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          PREVIEW_URL="${PREVIEW_BASE_URL%/}/beauty-check/"
          gh pr comment 33 --body "✅ Beauty Check v2 preview deployed and verified: $PREVIEW_URL"
