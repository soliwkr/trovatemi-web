name: Preview Trovatemi public experience

on:
  push:
    branches: [feat/beauty-check-passaparola-v2]
    paths:
      - ".github/workflows/preview-beauty-check-v2.yml"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "src/pages/index.astro"
      - "src/pages/beauty-check/**"
      - "src/pages/api/places/**"
      - "src/data/beauty-check-v2.mjs"
      - "src/data/beauty-lean-demo.mjs"
      - "src/data/google-places.mjs"
      - "src/layouts/BeautyLeanLayout.astro"
      - "src/styles/beauty-lean.css"
      - "src/styles/beauty-check-v2.css"
      - "tests/beauty-check-v2.test.mjs"
      - "tests/google-places.test.mjs"
      - "wrangler.beauty-check-v2-preview.jsonc"

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: preview-beauty-check-passaparola-v2
  cancel-in-progress: true

jobs:
  preview:
    name: Validate and publish Trovatemi preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run check

      - name: Run diagnostic tests
        run: node --test tests/beauty-check-v2.test.mjs tests/google-places.test.mjs

      - name: Build Astro Worker
        run: npm run build

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Publish isolated preview Worker
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.112.0"
          command: deploy --config wrangler.beauty-check-v2-preview.jsonc

      - name: Provision optional Google Places secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          if [ -z "$GOOGLE_PLACES_API_KEY" ]; then
            echo "GOOGLE_PLACES_API_KEY not configured; preview will use the explicit demo fallback."
            exit 0
          fi
          printf '%s' "$GOOGLE_PLACES_API_KEY" | npx wrangler secret put GOOGLE_PLACES_API_KEY --config wrangler.beauty-check-v2-preview.jsonc
          echo "Google Places secret provisioned for isolated preview."

      - name: Verify public experience
        env:
          PREVIEW_BASE_URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          set -euo pipefail

          test -n "$PREVIEW_BASE_URL" || { echo "Missing preview deployment URL"; exit 1; }
          BASE_URL="${PREVIEW_BASE_URL%/}"

          fetch_text_with_markers() {
            url="$1"
            file="$2"
            label="$3"
            shift 3

            attempt=1
            while [ "$attempt" -le 12 ]; do
              if curl --fail --location --silent --show-error --max-time 20 "$url" > "$file"; then
                missing=""
                for marker in "$@"; do
                  if ! grep -Fq "$marker" "$file"; then
                    missing="$marker"
                    break
                  fi
                done

                if [ -z "$missing" ]; then
                  echo "$label verified on attempt $attempt."
                  return 0
                fi

                echo "$label attempt $attempt returned stale/incomplete content; missing marker: $missing" >&2
              else
                echo "$label attempt $attempt could not be fetched." >&2
              fi

              attempt=$((attempt + 1))
              sleep 3
            done

            echo "$label did not converge after 12 attempts: $url" >&2
            return 1
          }

          fetch_text_with_markers             "$BASE_URL/"             "$RUNNER_TEMP/trovatemi-home.html"             "Trovatemi homepage"             "Il cliente ti sta già cercando."             "Il problema è che trova un altro."             "21 giorni per capire se entra davvero nel tuo lavoro."             "€149"

          fetch_text_with_markers             "$BASE_URL/beauty-check/"             "$RUNNER_TEMP/trovatemi-diagnostic.html"             "Trovatemi diagnostic"             "Trovatemi | Il passaparola che hai già. Messo al lavoro."             "data-proof-app"             "CERCA LA TUA ATTIVITÀ"             "TRE DOMANDE. FINE."

          echo "Trovatemi preview — $BASE_URL/" >> "$GITHUB_STEP_SUMMARY"
          echo "Diagnostic — $BASE_URL/beauty-check/" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live Places search, details and same-query context
        env:
          PREVIEW_BASE_URL: ${{ steps.publish.outputs.deployment-url }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          if [ -z "$GOOGLE_PLACES_API_KEY" ]; then
            echo "Live Places proof skipped: GOOGLE_PLACES_API_KEY is not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BASE_URL="${PREVIEW_BASE_URL%/}"
          SEARCH_JSON=$(curl --fail --silent --show-error --get             --retry 6 --retry-all-errors --retry-delay 2 --max-time 20             --data-urlencode "q=Nails Formia"             "$BASE_URL/api/places/search")

          printf '%s' "$SEARCH_JSON" | grep -Fq '"source":"google_maps"'
          PLACE_ID=$(printf '%s' "$SEARCH_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const p=JSON.parse(s).places?.[0]?.id||'';process.stdout.write(p)})")
          test -n "$PLACE_ID" || { echo "Places search returned no selectable business for Nails Formia"; exit 1; }

          DETAILS_JSON=$(curl --fail --silent --show-error --get             --retry 6 --retry-all-errors --retry-delay 2 --max-time 20             --data-urlencode "id=$PLACE_ID"             "$BASE_URL/api/places/details")
          printf '%s' "$DETAILS_JSON" | grep -Fq '"source":"google_maps"'
          printf '%s' "$DETAILS_JSON" | grep -Fq '"business"'

          CONTEXT_JSON=$(curl --fail --silent --show-error --get             --retry 6 --retry-all-errors --retry-delay 2 --max-time 20             --data-urlencode "q=Nails Formia"             "$BASE_URL/api/places/context")
          printf '%s' "$CONTEXT_JSON" | grep -Fq '"method":"same_text_query"'
          CONTEXT_COUNT=$(printf '%s' "$CONTEXT_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const p=JSON.parse(s).places||[];process.stdout.write(String(p.length))})")
          test "$CONTEXT_COUNT" -ge 4 || { echo "Same-query context returned fewer than four real results"; exit 1; }
          printf '%s' "$CONTEXT_JSON" | grep -Fq '"rating"'
          printf '%s' "$CONTEXT_JSON" | grep -Fq '"reviews"'

          echo "Live Places proof passed: Nails Formia search + details + same-query context ($CONTEXT_COUNT results)." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish preview URL on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_BASE_URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          BASE_URL="${PREVIEW_BASE_URL%/}"
          gh pr comment 33 --body "✅ Trovatemi proof demonstration deployed and verified: $BASE_URL/ · proof demo: $BASE_URL/beauty-check/"
