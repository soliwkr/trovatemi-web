name: Preview V13 on Cloudflare Workers

on:
  pull_request:
    branches: [main, agent/v13-aceternity-rebuild]
    paths:
      - ".github/workflows/preview-v13.yml"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "scripts/verify-v13.mjs"
      - "src/components/v12/Aceternity.tsx"
      - "src/components/v13-rebuild/**"
      - "src/data/demo-tenants.ts"
      - "src/data/site-copy.ts"
      - "src/data/vertical-messaging.ts"
      - "src/layouts/V13AceternityLayout.astro"
      - "src/pages/brand-demo-v13/**"
      - "src/pages/demo/**"
      - "src/pages/link/**"
      - "src/pages/per/**"
      - "src/styles/v13-aceternity.css"
      - "wrangler.v13-preview.jsonc"

permissions:
  contents: read

concurrency:
  group: preview-v13-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Validate and publish isolated V13 preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate reset
        run: npm run qa:reset

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Publish isolated preview Worker
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.112.0"
          command: deploy --config wrangler.v13-preview.jsonc

      - name: Verify preview routes
        env:
          PREVIEW_BASE_URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          test -n "$PREVIEW_BASE_URL" || { echo "Missing preview deployment URL"; exit 1; }

          verify_route() {
            route="$1"
            marker="$2"
            output="$RUNNER_TEMP/${route//\//-}.html"

            for attempt in {1..12}; do
              if curl --fail --silent --show-error --max-time 20 \
                "${PREVIEW_BASE_URL%/}/$route" > "$output" \
                && grep -Fq "$marker" "$output"
              then
                return 0
              fi

              if [ "$attempt" -lt 12 ]; then
                sleep 5
              fi
            done

            echo "Preview route not ready: $route" >&2
            return 1
          }

          verify_route "brand-demo-v13/" "HomeExperience"
          verify_route "demo/" "DemoExperiences"
          verify_route "demo/luxury-watches/" "luxury-watches"
          verify_route "link/grand-hotel-riviera/" "BioLinkExperience"
          verify_route "per/wellness-spa/" "LandingExperiences"

          echo "Preview V13 — ${PREVIEW_BASE_URL%/}/brand-demo-v13/" >> "$GITHUB_STEP_SUMMARY"
